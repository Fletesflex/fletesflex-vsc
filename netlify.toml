# Netlify no trae Flutter: lo descarga y compila la versión web.
[build]
  command = "git clone https://github.com/flutter/flutter.git -b stable --depth 1 $HOME/flutter && $HOME/flutter/bin/flutter config --enable-web && $HOME/flutter/bin/flutter build web --release"
  publish = "build/web"

# Single-page app: cualquier ruta devuelve index.html.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
